services:
  - type: web
    name: construction-safety-api
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: construction-safety-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
databases:
  - name: construction-safety-db
    databaseName: safety_platform
    user: safety_user
